[project]
name = "dune-path-classifier"
version = "0.1.0"
description = "DUNE LArTPC track/shower classification project starter kit"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "uproot",
    "awkward",
    "matplotlib",
    "scikit-learn>=1.4",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["uproot_io"]
